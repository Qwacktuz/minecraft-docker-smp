[project]
name = "minecraft-docker-smp"
revision = "1.0"

# declared in .config/secretspec/comfig.toml
# [providers]
# mc_prod_vault = "protonpass://SecretSpec"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

# Add secrets with `secretspec set NAME_ID --provider protonpass://VaultName`
[profiles.default]
AWS_SECRET_ACCESS_KEY = { description = "Cloudflare R2 access key for S3 bucket", required = true, providers = [
  "mc_prod_vault",
] }
AWS_ACCESS_KEY_ID = { description = "Cloudflare R2 Key ID for S3 bucket", required = true, providers = [
  "mc_prod_vault",
] }
TAILSCALE_API_KEY = { description = "Tailscale API key", required = true, providers = [
  "mc_prod_vault",
] }
TAILSCALE_TAILNET = { description = "Tailscale tailnet", required = true, providers = [
  "mc_prod_vault",
] }
HCLOUD_TOKEN = { description = "Hetzner cloud token", required = true, providers = [
  "mc_prod_vault",
] }
# TF_VAR_server_name = { description = "Terraform server name", required = true }
# TF_VAR_ts_tailnet = { description = "Terraform tailscale tailenet", required = true }
#
# [profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }
