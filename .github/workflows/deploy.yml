name: Minecraft Stack CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Infrastructure operation
        type: choice
        options: [apply, destroy]
        default: apply
      destroy_confirmation:
        description: "For destroy only: type the server hostname. This deletes the VPS and its world disk."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: minecraft-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  terraform:
    name: OpenTofu Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    environment: mc-prod
    outputs:
      tailscale_ipv4: ${{ steps.infrastructure.outputs.tailscale_ipv4 }}
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TF_VAR_ts_oauth_client_secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      TF_VAR_ts_tailnet: ${{ vars.TS_TAILNET }}
      TF_VAR_username: ${{ vars.USERNAME }}
      TF_VAR_server_name: ${{ vars.TS_HOST || 'mc-prod' }}

      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: OpenTofu Init and Lifecycle
        id: infrastructure
        env:
          OPERATION: ${{ inputs.operation || 'apply' }}
          DESTROY_CONFIRMATION: ${{ inputs.destroy_confirmation }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [[ "$OPERATION" == destroy && "$DESTROY_CONFIRMATION" != "$TF_VAR_server_name" ]]; then
            echo "::error::Destroy requires the exact server hostname as confirmation."
            exit 1
          fi
          if [[ "$OPERATION" != apply && "$OPERATION" != destroy ]]; then
            echo "::error::Unsupported infrastructure operation."
            exit 1
          fi
          tofu init \
            -input=false -lockfile=readonly \
            -backend-config="bucket=$R2_BUCKET_NAME" \
            -backend-config="endpoint=$R2_ENDPOINT" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true"
          if [[ "$OPERATION" == destroy ]]; then
            tofu destroy -input=false -auto-approve
          else
            tofu apply -input=false -auto-approve
            TS_IP=$(tofu output -raw tailscale_ipv4)
            echo "tailscale_ipv4=$TS_IP" >> "$GITHUB_OUTPUT"
          fi

  # -- Application (Docker Compose) ---
  deploy:
    name: Deploy Application
    needs: terraform
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'destroy' }}
    runs-on: ubuntu-latest
    environment: mc-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Authenticate with Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Wait for Server Tailscale Connectivity
        env:
          TS_IP: ${{ needs.terraform.outputs.tailscale_ipv4 }}
        run: |
          : "${TS_IP:?OpenTofu must return the registered server address}"
          echo "Waiting for the registered Minecraft device to become reachable..."
          # TS_IP is expanded by the child shell.
          # shellcheck disable=SC2016
          if ! timeout 300s bash -e -c '
            until tailscale ping --timeout=5s --c=1 "$TS_IP"; do
              echo "Tailscale connectivity failed. Retrying in 10 seconds..." >&2
              sleep 10
            done
            echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          '; then
            echo "::error::Registered Minecraft device is unreachable. Check server health and tag:ci access to tag:server."
            tailscale status || true
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REPO: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ env.TS_IP }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SOPS_AGE_KEY,DEPLOY_SHA,DEPLOY_REPO
          command_timeout: 30m
          script: |
            set -eu
            APP_DIR="$HOME/app"
            : "${DEPLOY_REPO:?Deployment repository is required}"

            sudo cloud-init status --wait
            mkdir -p "$APP_DIR"
            exec 9>"$HOME/.minecraft-deploy.lock"
            flock -w 1800 9
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              git clone "$DEPLOY_REPO" .
            fi
            git remote set-url origin "$DEPLOY_REPO"
            git fetch origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            APP_DIR="$APP_DIR" bash scripts/deploy.sh
