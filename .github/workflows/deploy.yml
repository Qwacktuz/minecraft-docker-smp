name: Minecraft Stack CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  terraform:
    name: OpenTofu Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    environment: mc-prod
    defaults:
      run:
        working-directory: ./infra
    env:
      TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
      TF_VAR_ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TF_VAR_ts_oauth_client_secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      TF_VAR_ts_tailnet: ${{ vars.TS_TAILNET }}
      TF_VAR_username: ${{ vars.USERNAME }}

      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: OpenTofu Init & Apply
        run: |
          tofu init \
            -backend-config="bucket=${{ secrets.R2_BUCKET_NAME }}" \
            -backend-config="endpoint=${{ secrets.R2_ENDPOINT }}" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true"
           tofu apply -auto-approve

  # -- Application (Docker Compose) ---
  deploy:
    name: Deploy Application
    needs: terraform
    runs-on: ubuntu-latest
    environment: mc-prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Authenticate with Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Resolve Server Tailscale IP
        env:
          TS_HOST: ${{ vars.TS_HOST }}
        run: |
          : "${TS_HOST:?Set the TS_HOST repository variable}"
          echo "Waiting for $TS_HOST to register on Tailnet..."
          # TS_HOST is expanded by the child shell.
          # shellcheck disable=SC2016
          timeout 300s bash -c '
            until tailscale ip -4 "$TS_HOST" >/dev/null 2>&1; do
              echo "Server not found yet. Retrying in 10 seconds..."
              sleep 10
            done
          '
          TS_IP=$(tailscale ip -4 "$TS_HOST")
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ env.TS_IP }}
          username: ${{ vars.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SOPS_AGE_KEY,DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -eu
            APP_DIR="$HOME/app"
            REPO="https://github.com/Qwacktuz/minecraft-smp.git"

            sudo cloud-init status --wait
            mkdir -p "$APP_DIR"
            exec 9>"$HOME/.minecraft-deploy.lock"
            flock -w 1800 9
            cd "$APP_DIR"

            if [ ! -d .git ]; then
              git clone "$REPO" .
            fi
            git fetch origin "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            APP_DIR="$APP_DIR" bash scripts/deploy.sh
