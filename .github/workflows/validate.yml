name: Validate configuration

# CI only validates. Servers are started and stopped with bin/server.
# Every tool version comes from devenv.nix/devenv.lock, the same as on a laptop.
on:
  pull_request:
  push:
  workflow_dispatch: # mods.yml starts it for its branch

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commits (tag in the comment); bump deliberately.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv

      - name: Install devenv (the version used locally)
        run: nix profile add github:cachix/devenv/v2.4.0

      - name: Run git hooks and every check in devenv.nix
        run: devenv test
