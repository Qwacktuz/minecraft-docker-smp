name: Validate configuration

# CI only validates. Servers are started and stopped with bin/server.
# Every tool version comes from devenv.nix/devenv.lock, the same as on a laptop.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Run git hooks and every check in devenv.nix
        run: devenv test
