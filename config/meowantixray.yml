# Managed in Git (config/meowantixray.yml). Changed from the defaults:
# engine mode 1 (ores not touching air are sent as stone; cheaper than mode 2),
# the Nether up to y=128 (quartz and gold reach that high), the End off.
# Paper-like anti-xray config for Meow Anti-Xray
# Existing config files are supplemented with new missing keys without overwriting your values.
# Quoted YAML scalars, quoted list items, and inline lists are supported.
anti-xray:
  enabled: true
  engine-mode: 1
  enforce-engine-mode-2: false
  max-block-height: 64
  only-obfuscate-hidden-blocks: false
  mode2-obfuscate-replacement-blocks: true
  guarantee-hide-all-hidden-blocks: true
  lava-obscures: false
  use-permission: false
  bypass-permission: paper.antixray.bypass
  async-chunk-rewrite: true
  async-worker-threads: 1
  async-queue-size: 16
  update-radius: 2
  update-interval-ticks: 10
  max-blocks-per-chunk: 32768
  hidden-blocks:
    - minecraft:diamond_ore
    - minecraft:deepslate_diamond_ore
    - minecraft:emerald_ore
    - minecraft:deepslate_emerald_ore
    - minecraft:gold_ore
    - minecraft:deepslate_gold_ore
    - minecraft:iron_ore
    - minecraft:deepslate_iron_ore
    - minecraft:redstone_ore
    - minecraft:deepslate_redstone_ore
    - minecraft:lapis_ore
    - minecraft:deepslate_lapis_ore
    - minecraft:mossy_cobblestone
    - minecraft:obsidian
    - minecraft:chest
    - minecraft:coal_ore
    - minecraft:deepslate_coal_ore
    - minecraft:copper_ore
    - minecraft:deepslate_copper_ore
    - minecraft:raw_copper_block
    - minecraft:raw_iron_block
    - minecraft:clay
    - minecraft:ender_chest
    - minecraft:ancient_debris
    - minecraft:nether_quartz_ore
    - minecraft:nether_gold_ore
  replacement-blocks:
    - minecraft:stone
    - minecraft:oak_planks
    - minecraft:deepslate
  dimension-settings:
    minecraft:overworld:
      enabled: true
      engine-mode: 1
      max-block-height: 64
      only-obfuscate-hidden-blocks: false
      mode2-obfuscate-replacement-blocks: true
      guarantee-hide-all-hidden-blocks: true
      lava-obscures: false
      use-permission: false
      bypass-permission: paper.antixray.bypass
      hidden-blocks:
        - minecraft:diamond_ore
        - minecraft:deepslate_diamond_ore
        - minecraft:emerald_ore
        - minecraft:deepslate_emerald_ore
        - minecraft:gold_ore
        - minecraft:deepslate_gold_ore
        - minecraft:iron_ore
        - minecraft:deepslate_iron_ore
        - minecraft:redstone_ore
        - minecraft:deepslate_redstone_ore
        - minecraft:lapis_ore
        - minecraft:deepslate_lapis_ore
        - minecraft:mossy_cobblestone
        - minecraft:obsidian
        - minecraft:chest
        - minecraft:coal_ore
        - minecraft:deepslate_coal_ore
        - minecraft:copper_ore
        - minecraft:deepslate_copper_ore
        - minecraft:raw_copper_block
        - minecraft:raw_iron_block
        - minecraft:clay
        - minecraft:ender_chest
        - minecraft:ancient_debris
        - minecraft:nether_quartz_ore
        - minecraft:nether_gold_ore
      replacement-blocks:
        - minecraft:stone
        - minecraft:oak_planks
        - minecraft:deepslate
    minecraft:the_nether:
      enabled: true
      engine-mode: 1
      max-block-height: 128
      only-obfuscate-hidden-blocks: false
      mode2-obfuscate-replacement-blocks: true
      guarantee-hide-all-hidden-blocks: true
      lava-obscures: false
      use-permission: false
      bypass-permission: paper.antixray.bypass
      hidden-blocks:
        - minecraft:ancient_debris
        - minecraft:nether_quartz_ore
        - minecraft:nether_gold_ore
      replacement-blocks:
        - minecraft:netherrack
        - minecraft:basalt
        - minecraft:blackstone
    minecraft:the_end:
      enabled: false
      engine-mode: 1
      max-block-height: 64
      only-obfuscate-hidden-blocks: false
      mode2-obfuscate-replacement-blocks: true
      guarantee-hide-all-hidden-blocks: true
      lava-obscures: false
      use-permission: false
      bypass-permission: paper.antixray.bypass
      hidden-blocks:
        - minecraft:diamond_ore
        - minecraft:deepslate_diamond_ore
        - minecraft:emerald_ore
        - minecraft:deepslate_emerald_ore
      replacement-blocks:
        - minecraft:end_stone
