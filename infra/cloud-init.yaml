#cloud-config

# The docker group exists before the user and before tailscaled starts:
# Tailscale SSH sessions only get the groups a user had when tailscaled started.
groups:
  - docker

users:
  - name: ${username}
    groups: sudo, docker
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${ssh_pub_key}

# Native Swap Configuration (2 GiB)
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2147483648

# Docker and Tailscale come from their signed apt repositories. The signing
# keys are in infra/keys/ (fingerprints in the comments), so nothing is piped
# from the internet into a shell.
apt:
  sources:
    docker.list:
      # 9DC8 5822 9FC7 DD38 854A  E2D8 8D81 803C 0EBF CD88
      source: "deb [signed-by=$KEY_FILE] https://download.docker.com/linux/debian $RELEASE stable"
      key: |
        ${indent(8, docker_key)}
    tailscale.list:
      # 2596 A99E AAB3 3821 893C  0A79 458C A832 957F 5868
      source: "deb [signed-by=$KEY_FILE] https://pkgs.tailscale.com/stable/debian $RELEASE main"
      key: |
        ${indent(8, tailscale_key)}

package_update: true
package_upgrade: true
packages:
  - curl
  - git
  - vim
  - ufw
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - tailscale

write_files:
  - path: /etc/ssh/sshd_config.d/minecraft-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes

runcmd:
  - set -e
  - [sh, -c, "echo 'Bootstrapping starting...' > /var/log/bootstrap.log"]

  - systemctl enable --now docker

  # Tailscale (installed above); restarted so the user's docker group applies.
  - sh -c "echo 'PORT=41641' > /etc/default/tailscaled"
  - systemctl restart tailscaled
  - tailscale up --authkey=${ts_authkey} --ssh --hostname=${hostname} --reset

  # SOPS, checked against the release's SHA-256 for this CPU architecture.
  - |
    set -e
    arch=$(dpkg --print-architecture)
    case "$arch" in
      amd64) sum=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b ;;
      arm64) sum=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77 ;;
      *) echo "no SOPS checksum for $arch" >&2; exit 1 ;;
    esac
    curl -fsSLo /tmp/sops "https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.$arch"
    echo "$sum  /tmp/sops" | sha256sum -c -
    install -m 755 /tmp/sops /usr/local/bin/sops

  # Apply SSH Hardening Config
  - systemctl reload sshd || systemctl reload ssh

  # Configure UFW Rules
  - systemctl enable ufw
  - /usr/sbin/ufw default deny incoming
  - /usr/sbin/ufw default allow outgoing
  - /usr/sbin/ufw allow 25565/tcp comment 'Minecraft'
  - /usr/sbin/ufw allow 24454/udp comment 'SimpleVoiceChat'
  - /usr/sbin/ufw allow 25454/udp comment 'Webcam mod'
  - /usr/sbin/ufw allow 41641/udp comment 'Tailscale Direct Communication'
  - /usr/sbin/ufw allow in on tailscale0 comment 'Trust Tailnet Traffic'
  - /usr/sbin/ufw deny 22/tcp comment 'Block Public SSH'
  - /usr/sbin/ufw --force enable

  - [sh, -c, "echo 'Bootstrapping finished.' >> /var/log/bootstrap.log"]
