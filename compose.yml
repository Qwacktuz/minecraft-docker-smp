x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Main SMP server
  minecraft-service:
    # Pinned (tag + multi-arch digest); bump deliberately.
    image: itzg/minecraft-server:2026.11.0-java25@sha256:8d5080d8dcd0a2629c2e4f248678373a337a40537ad6ef2857c7dbcda6e3eadd
    container_name: fabric-server
    stop_grace_period: 2m
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "25565:25565/tcp"
      - "24454:24454/udp" # simplevoicechat mod
      - "25454:25454/udp" # webcam mod
    environment:
      EULA: true
      TYPE: FABRIC
      FABRIC_LOADER_VERSION: "0.20.1"

      VERSION: "26.3"
      MOTD: "§a§lkaktus SMP§r §7· Fabric %VERSION% · §cHard\n§bVoice chat on§7 · §ertfm"
      ICON: "/icon.png"
      OVERRIDE_ICON: true
      LEVEL: "world"
      ONLINE_MODE: true

      MAX_PLAYERS: "20"
      DIFFICULTY: HARD
      MODE: "SURVIVAL"
      PVP: "TRUE"

      VIEW_DISTANCE: 12
      SPAWN_PROTECTION: 0
      SIMULATION_DISTANCE: 10

      EXISTING_OPS_FILE: "SYNCHRONIZE"
      OPS: "${MC_OPS:-}"
      EXISTING_WHITELIST_FILE: "SYNCHRONIZE"
      WHITELIST: "${MC_WHITELIST:?Set MC_WHITELIST in .env}"
      ENFORCE_WHITELIST: true
      ENABLE_WHITELIST: true

      RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in .env}

      # MeowIce's aggressive JIT flags crash the JVM's C2 compiler on ARM64;
      # deploy.sh switches ARM hosts to Aikar's G1 flags instead.
      USE_MEOWICE_FLAGS: "${USE_MEOWICE_FLAGS:-true}"
      USE_AIKAR_FLAGS: "${USE_AIKAR_FLAGS:-false}"
      MEMORY: 5G

      REMOVE_OLD_MODS: true
      VANILLATWEAKS_SHARECODE: fBtCTb
      # VERSION_FROM_MODRINTH_PROJECTS: true
      MODRINTH_ALLOWED_VERSION_TYPE: RELEASE
      MODRINTH_PROJECTS_DEFAULT_VERSION_TYPE: RELEASE
      MODRINTH_DOWNLOAD_DEPENDENCIES: REQUIRED
      MODRINTH_PROJECTS: |
        datapack:skull-portable:iVVgIoCY # 1.3.4-mc26.3

        fabric-api:Zns5SSRA # 0.166.2+26.3
        fabric-language-kotlin:SKW1BTL3 # 1.14.2+kotlin.2.4.21
        #fabricexporter # No 26.3 release candidate yet
        #fabric-permissions-api

        asynclogger:3Klv7aWV # 2.2.3+26.1.2-fabric
        spark:e3hsPc1o # 1.10.187-fabric
        #krypton
        ferrite-core:d5ddUdiB # 9.0.0-fabric
        lithium:Lal8mJGR # mc26.3-0.26.4-fabric
        scalablelux:g4eqNSKd # 0.3.0-alpha.0.6+26.3 [alpha]
        c2me-fabric:Qfm2hhas # 0.4.2-alpha.0.121+26.3 [alpha]
        servercore:YNdFPSov # 1.5.21+26.3
        alternate-current:nSBWPz6x # mc26.3-1.9.0
        clumps:J4I1wxJZ # 26.3.2
        get-it-together-drops:BOGqc3kp # v1.5.1
        forge-config-api-port:JpKvrr9J # 26.3.1 (needed by get-it-together-drops)
        lmd:a3ISt6Ob # 1.26.11.1
        almanac:mSuvUaBg # 1.26.11.1 (needed by lmd)
        zfastnoise:spz6mS8r # 1.1.3+26.3
        zconfig:tsgt79sG # 1.0.0+26.x (needed by zfastnoise)
        modernfix-mvus:pa9cAfYg # 5.27.20-build.2

        bookshelf-inspector:ShIoLf04 # 2.4+26.3
        cloth-config:fg2uyxOW # 26.3.159+fabric (needed by bookshelf-inspector)
        modmenu:xckkBHD5 # 21.0.1 (needed by bookshelf-inspector)
        placeholder-api:lXytLqWj # 3.2.0+26.3 (needed by modmenu)
        syncmatica:uT7TJ2Wp # 0.3.20
        servux:azA4UG3T # 0.12.2
        balm:MYj31XNG # 26.3.0.3+fabric-26.3 (soft dependency)
        carpet:yt9oDFOj # 26.3
        carpet-tis-addition:Zo8yy53j # v1.83.3-mc26.3
        gca:8yK6Cys7 # v2.12.10+build.105
        no-chat-reports:9PkfND1A # Fabric-MC26.3-v2.21.2
        #chunky
        packet-fixer:dTKbGYbb # 3.3.6
        luckperms:DzQPkkXY # v5.5.85-fabric
        #bluemap
        #axiom
        vanish:KgeCcJWw # 1.6.16+26.3
        simple-voice-chat:x9jLR94Q # fabric-2.6.27+26.3 [beta]
        webcam-mod:SOF9XznV # fabric-4.4.1-26.3
        appleskin:PHjDtQay # 3.0.10+mc26.3
        armor-stands:hEN85qop # 3.0.4+26.3-fabric

      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 0
        carpet setDefault optimizedTNT true
        carpet setDefault optimizedTNTHighPriority true
        carpet setDefault optimizedFastEntityMovement true
        carpet setDefault commandPlayer true
        carpet setDefault openFakePlayerInventory true

    volumes:
      - ./static/icon.png:/icon.png
      - ./data/minecraft:/data

    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 6m
    deploy:
      resources:
        limits:
          memory: 6656M

  # Only the VPS runs backups: deploy.sh enables this profile with BACKUPS=1.
  # A local copy of the world is read-only and never writes to R2.
  backup:
    image: itzg/mc-backup:2026.11.1@sha256:d731fa58822525cc65a23fbd82f472be4fc74854ee313da36bb4872bdba722c7 # = BACKUP_IMAGE in scripts/lib.sh
    container_name: mc-backup
    profiles: [backup]
    restart: unless-stopped
    logging: *bounded-logging
    security_opt:
      - no-new-privileges:true
    environment:
      INITIAL_DELAY: 1m
      BACKUP_INTERVAL: 1h
      RCON_HOST: minecraft-service
      RCON_PASSWORD: "${RCON_PASSWORD:?Set RCON_PASSWORD in .env}"
      PAUSE_IF_NO_PLAYERS: true

      # Alerts: after every backup, ping the healthchecks.io check in
      # BACKUP_PING_URL (app.enc.env) with the exit status; a failure alerts at
      # once, with the log attached. No ping for a day alerts too. `bin/server
      # stop` pauses the check. Without BACKUP_PING_URL this does nothing.
      BACKUP_PING_URL: "${BACKUP_PING_URL:-}"
      POST_BACKUP_SCRIPT: |
        [ -n "$$BACKUP_PING_URL" ] || exit 0
        curl -fsS -m 10 --retry 3 --data-binary "@$$2" "$$BACKUP_PING_URL/$$1" >/dev/null ||
          echo "could not reach the backup alert check" >&2

      # Compression & Size Savings (exclude bluemap)
      EXCLUDES: "bluemap,logs,cache,emotes,*.tmp,web,*.map"

      # Snapshots tagged pre-prune (taken before a chunk prune) and pre-restore
      # (the safety backup before `bin/server restore`) are kept too;
      # bin/server keeps each tag on the newest few only.
      PRUNE_RESTIC_RETENTION: "--keep-within 24h --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --keep-tag pre-prune --keep-tag pre-restore"
      BACKUP_METHOD: "restic"
      # The identity restores filter on (deploy.sh, bin/server). Older snapshots
      # carry this name too, from when it was the container hostname.
      RESTIC_HOST: mc-backup-worker
      RESTIC_REPOSITORY: "s3:${R2_ENDPOINT:?Set R2_ENDPOINT in .env}/${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in .env}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in .env}"
      AWS_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in .env}"
      AWS_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in .env}"
      RESTIC_OPTS: "-o s3.connections=10 -o s3.region=auto --compression auto"
    volumes:
      - ./data/minecraft:/data:ro
    depends_on:
      minecraft-service:
        condition: service_healthy
